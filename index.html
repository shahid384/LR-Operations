<style>

body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}

main{flex:1;min-width:0;padding:34px 40px;max-width:1280px}
.top{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:26px}
.top h2{margin:0;font:500 30px/1.15 Fraunces,Georgia,serif;letter-spacing:-.015em;flex:1;color:var(--tx)}

input:focus,select:focus,textarea:focus{outline:0;border-color:var(--pri);box-shadow:0 0 0 3px var(--priL)}
.top input,.top select{width:auto}
.btn{background:var(--pri);color:#fff;border:0;border-radius:10px;padding:9px 18px;font:500 13.5px Inter,sans-serif;cursor:pointer;width:auto;box-shadow:0 1px 2px rgba(21,70,50,.25);transition:background .15s}
.btn:hover{background:var(--priD)}
.btn.g{background:#fff;color:var(--tx);border:1px solid var(--line);box-shadow:none}.btn.g:hover{background:var(--bg)}
.btn.s{padding:4px 11px;font-size:12px;border-radius:8px}.btn.d{color:var(--red)}

</style></head><body>
<div class="app"><nav id="nav"></nav><main id="main"><p class="mut">Loading…</p></main></div>
<script>
let FUND=200000,TARGET=100000;const PRI=["High","Medium","Low"],ST=["Not Started","In Progress","Completed","Delayed"];
const D={tasks:[],proc:[],sales:[],team:[],stock:[],cash:[],days:[],harvest:[],recurring:[],users:[],audit:[]},loaded={};
let asg=null,mine=false,db,ME={},ROLE="",mgmt=false,canClose=false,unsubs=[],genDone=false,seedDone=false,setNone=false,pendingName="",view="home",day=td(),editing=null,adding=false,q="",ready=false;
function td(){const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)}
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const inr=n=>"₹"+Math.round(n||0).toLocaleString("en-IN");
const sum=(a,f)=>a.reduce((t,x)=>t+f(x),0);
const names=()=>D.team.map(t=>t.name).sort();
const val=s=>(+s.qty||0)*(+s.rate||0);
const overdue=t=>t.status!=="Completed"&&t.deadline&&new Date(t.deadline)<new Date();
const isDelayed=t=>t.status==="Delayed"||overdue(t);
const F={
 tasks:[["title","Task","text",1],["cat","Category",CATS,1],["owners","Owners","multi",1],["note","Instructions for the assigned person(s)","area"],["date","Date","date",1],["deadline","Deadline","datetime-local",1],["priority","Priority",PRI,1],["status","Status",ST,1],["desc","Description / expected outcome","area"],["remarks","Remarks","area"],["result","Actual result","area"]],
 proc:[["date","Date","date",1],["farmer","Farmer","text",1],["variety","Flower variety","text",1],["qty","Quantity","number",1],["rate","Buying rate (₹)","number",1],["quality","Quality",["A","B","C"],1],["approvedBy","Approved by","team",1]],
 sales:[["date","Date","date",1],["buyer","Buyer","text",1],["variety","Flower variety","text",1],["qty","Quantity sold","number",1],["rate","Selling rate (₹)","number",1],["person","Person responsible","team",1],["pay","Payment status",["Paid","Pending"],1],["mode","Payment mode",["Cash","UPI","Card"],1]],
 harvest:[["date","Date","date",1],["farm","Own farm / block","text",1],["variety","Flower variety","text",1],["qty","Quantity added","number",1],["rate","Cost per unit (₹, optional)","number"],["note","Note","text"]],
 recurring:[["title","Task","text",1],["cat","Category",CATS,1],["owners","Default owners (optional, changed each day when assigning)","multi"],["repeat","Repeats",["Every day","Mon","Tue","Wed","Thu","Fri","Sat","Sun"],1],["time","Deadline time","time",1],["priority","Priority",PRI,1],["desc","Description","area"],["active","Active",["Yes","No"],1]],
 team:[["name","Name","text",1],["role","Responsibility","text",1]]};
const TITLE={home:"Dashboard",tasks:"Tasks",proc:"Procurement",sales:"Sales",stock:"Stock",harvest:"Stock · own-farm additions",cash:"Cash flow",review:"Daily Review",reports:"Reports",history:"History",recurring:"Fixed daily tasks",team:"Team",settings:"Settings",users:"Users & roles",audit:"Change log"};
const COORD=[],ADMIN=["settings","users","audit"],NODAY=["team","history","reports","users","audit","settings","recurring"];
const COLS={
 tasks:[["Task",t=>`<b>${esc(t.title)}</b>${t.date&&t.date<day&&t.status!=="Completed"?` <span class="tag warn">Carried over from ${esc(t.date)}</span>`:""}<div class="mut">${esc(t.desc)}</div>${t.note?`<div style="margin-top:4px"><span class="tag warn">Instruction</span> ${esc(t.note)}</div>`:""}`],["Owners",t=>(t.owners||[]).length?esc(t.owners.join(", ")):'<span class="tag bad">Unassigned</span>'],["Deadline",t=>esc((t.deadline||"").replace("T"," "))],["Priority",t=>`<span class="tag ${t.priority==="High"?"bad":t.priority==="Medium"?"warn":""}">${esc(t.priority)}</span>`],["Status",t=>`<span class="tag ${t.status==="Completed"?"ok":isDelayed(t)?"bad":""}">${esc(overdue(t)&&t.status!=="Delayed"?t.status+" · overdue":t.status)}</span>`],["Notes",t=>esc([t.remarks,t.result&&"Result: "+t.result].filter(Boolean).join(" | "))]],
 proc:[["Farmer",r=>esc(r.farmer)],["Variety",r=>esc(r.variety)],["Qty",r=>r.qty,1],["Rate",r=>inr(r.rate),1],["Quality",r=>esc(r.quality)],["Approved by",r=>esc(r.approvedBy)],["Approval",r=>r.approval==="pending"?'<span class="tag bad">Awaiting approval</span>':r.approval==="approved"?'<span class="tag ok">Approved</span>':"—"],["Total",r=>`<b>${inr(val(r))}</b>`,1]],
 sales:[["Buyer",r=>esc(r.buyer)],["Variety",r=>esc(r.variety)],["Qty",r=>r.qty,1],["Rate",r=>inr(r.rate),1],["Total",r=>`<b>${inr(val(r))}</b>`,1],["By",r=>esc(r.person)],["Payment",r=>`<span class="tag ${r.pay==="Paid"?"ok":"bad"}">${esc(r.pay)}</span> ${esc(r.mode)}`]],
 harvest:[["Farm",r=>esc(r.farm)],["Variety",r=>esc(r.variety)],["Qty",r=>r.qty,1],["Cost/unit",r=>+r.rate>0?inr(r.rate):"—",1],["Note",r=>esc(r.note)]],
 recurring:[["Task",r=>`<b>${esc(r.title)}</b><div class="mut">${esc(r.desc)}</div>`],["Owners",r=>esc((r.owners||[]).join(", "))],["Category",r=>esc(r.cat||CATBYID[r.id]||"Other")],["Repeats",r=>esc(r.repeat||"Every day")],["By",r=>esc(r.time)],["Priority",r=>esc(r.priority)],["Active",r=>`<span class="tag ${r.active==="No"?"":"ok"}">${esc(r.active)}</span>`]],
 team:[["Name",r=>`<b>${esc(r.name)}</b>`],["Responsibility",r=>esc(r.role)]]};
const carried=()=>day>=td()?D.tasks.filter(t=>t.date&&t.date<day&&t.status!=="Completed"):[];
const byDay=c=>c==="tasks"?[...D.tasks.filter(r=>!r.date||r.date===day||(r.completedOn===day&&r.status==="Completed")),...carried()]:D[c].filter(r=>!r.date||r.date===day);
function addD(d,n){const x=new Date(d+"T00:00:00");x.setDate(x.getDate()+n);return new Date(x-x.getTimezoneOffset()*6e4).toISOString().slice(0,10)}
function shift(n){day=addD(day,n);render()}
let hf=addD(td(),-6),ht=td();
function preset(k){const t=td();if(k==="t")hf=ht=t;if(k==="y")hf=ht=addD(t,-1);if(k==="7"){hf=addD(t,-6);ht=t}if(k==="30"){hf=addD(t,-29);ht=t}if(k==="m"){hf=t.slice(0,8)+"01";ht=t}render()}
let HR=[];
function hist(){
 HR=[];
 for(let d=ht,i=0;d>=hf&&i<366;d=addD(d,-1),i++){
  const s=D.sales.filter(r=>r.date===d),p=D.proc.filter(r=>r.date===d),t=D.tasks.filter(r=>r.date===d);
  if(!s.length&&!p.length&&!t.length)continue;
  const sv=sum(s,val),c=sum(s.filter(r=>r.pay==="Paid"),val);
  HR.push({d,sv,c,pd:sv-c,pr:sum(p,val),tt:t.length,done:t.filter(x=>x.status==="Completed").length});
 }
 const T=k=>sum(HR,r=>r[k]);
 const pb=(k,l)=>`<button class="btn g s" onclick="preset('${k}')">${l}</button>`;
 return `<div class="top" style="margin-top:-10px"><label class="mut">From</label><input type="date" value="${hf}" onchange="hf=this.value;render()"><label class="mut">To</label><input type="date" value="${ht}" onchange="ht=this.value;render()">${pb("t","Today")}${pb("y","Yesterday")}${pb("7","Last 7 days")}${pb("30","Last 30 days")}${pb("m","This month")}<button class="btn g" onclick="histCsv()">CSV</button></div>
 <div class="tw"><table><tr><th>Date</th><th class="num">Sales</th><th class="num">vs target</th><th class="num">Collected</th><th class="num">Pending</th><th class="num">Procurement</th><th class="num">Tasks done</th><th></th></tr>
 ${HR.map(r=>`<tr><td><b>${r.d}</b></td><td class="num">${inr(r.sv)}</td><td class="num"><span class="tag ${r.sv>=TARGET?"ok":"warn"}">${Math.round(r.sv/TARGET*100)}%</span></td><td class="num">${inr(r.c)}</td><td class="num">${r.pd?`<span class="tag bad">${inr(r.pd)}</span>`:"—"}</td><td class="num">${inr(r.pr)}</td><td class="num">${r.done}/${r.tt}</td><td class="num"><button class="btn g s" onclick="day='${r.d}';go('home')">Open day</button></td></tr>`).join("")||'<tr><td colspan="8" class="mut">No records in this range.</td></tr>'}
 ${HR.length?`<tr><td><b>Total</b></td><td class="num"><b>${inr(T("sv"))}</b></td><td></td><td class="num"><b>${inr(T("c"))}</b></td><td class="num"><b>${inr(T("pd"))}</b></td><td class="num"><b>${inr(T("pr"))}</b></td><td class="num"><b>${T("done")}/${T("tt")}</b></td><td></td></tr>`:""}</table></div>`;
}
async function histCsv(){
 const out="date,sales,collected,pending,procurement,tasks_done,tasks_total\n"+HR.map(r=>[r.d,r.sv,r.c,r.pd,r.pr,r.done,r.tt].join(",")).join("\n");
 saveFile(`lr-farms-history-${hf}-to-${ht}.csv`,out)
}
function match(r){return !q||JSON.stringify(Object.values(r)).toLowerCase().includes(q.toLowerCase())}

function render(){
 if(!ready)return;
 if(document.activeElement&&document.activeElement.closest&&document.activeElement.closest(".assignbox"))return;
 memo={};
 document.getElementById("nav").innerHTML='<h1>LR Farms<small>Daily Operations</small></h1>'+Object.keys(TITLE).filter(k=>k!=="harvest"&&k!=="recurring"&&(mgmt||!ADMIN.includes(k))&&(canClose||!COORD.includes(k))).map(k=>`<button class="${k===view||(k==="stock"&&view==="harvest")||(k==="tasks"&&view==="recurring")?"on":""}" onclick="go('${k}')">${TITLE[k]}</button>`).join("")+`<div class="who"><b>${esc(ME.name)}</b><span class="mut"> · ${esc(ROLE)}</span><br><button class="btn g s" onclick="FB.signOut(FB.auth)">Sign out</button></div>`;
 const m=document.getElementById("main");
 const bar=`<div class="top"><h2>${TITLE[view]}</h2>${!NODAY.includes(view)?`<button class="btn g s" onclick="shift(-1)">‹</button><input type="date" value="${day}" onchange="day=this.value;render()"><button class="btn g s" onclick="shift(1)">›</button>${day!==td()?`<button class="btn g s" onclick="day=td();render()">Today</button>`:""}`:""}${view==="tasks"&&ME.member?`<button class="btn g s" onclick="mine=!mine;render()">${mine?"Show all tasks":"Only my tasks"}</button>`:""}${!SP[view]?`<input type="search" placeholder="Search" value="${esc(q)}" oninput="q=this.value;renderList()" style="width:150px">`:""}${SP[view]||view==="team"?"":`<button class="btn" onclick="adding=true;editing=null;render()">${view==="recurring"?"+ Add fixed task":view==="tasks"?"+ Add new task":"+ Add"}</button><button class="btn g" onclick="csv()">CSV</button>`}${view==="team"&&mgmt?`<button class="btn" onclick="adding=true;editing=null;render()">+ Add member</button>`:""}</div>`;
 m.innerHTML=bar+lockBanner()+(SP[view]?SP[view]():`${view==="harvest"?stockTabs():""}${(view==="tasks"||view==="recurring")&&canClose?taskTabs():""}${view==="tasks"&&canClose?genBanner():""}${view==="recurring"&&loaded.recurring&&!D.recurring.length?`<div class="al ok">No daily tasks yet. <button class="btn s" onclick="seedTasks()">Load the standard daily tasks</button> taken from your morning-meeting notes. You can edit them afterwards.</div>`:""}${adding||editing?formHtml():""}<div id="list"></div>`);
 if(!SP[view])renderList();
}
const SP={home:()=>home(),stock:()=>stockV(),cash:()=>cashV(),review:()=>reviewV(),reports:()=>reportsV(),history:()=>hist(),settings:()=>settingsV(),users:()=>usersV(),audit:()=>auditV()};
let memo={},SR=[],SNAP={};
const vk=x=>String(x||"").trim().toLowerCase();
const isClosed=d=>!!D.days.find(x=>x.date===d&&x.closed);
const lockBanner=()=>isClosed(day)&&["proc","sales","stock","harvest","cash"].includes(view)?'<div class="al">This day is closed — only management can change its records.</div>':"";
const allV=()=>[...D.proc,...D.sales,...D.stock,...D.harvest];
const SUG={buyer:1,farmer:1,variety:1,farm:1};
function sugg(k){const src={buyer:()=>D.sales.map(r=>r.buyer),farmer:()=>D.proc.map(r=>r.farmer),farm:()=>D.harvest.map(r=>r.farm),variety:()=>Object.values(vnames())}[k]();const m={};src.forEach(n=>{n=String(n||"").trim();if(n&&!m[vk(n)])m[vk(n)]=n});return Object.values(m).sort()}
function vnames(){const m={};allV().forEach(r=>{const k=vk(r.variety);if(k&&!m[k])m[k]=String(r.variety).trim()});return m}
function rateFor(v,d){let b="";D.proc.forEach(r=>{if(vk(r.variety)===v&&r.date<=d&&r.date>b)b=r.date});const P=D.proc.filter(r=>vk(r.variety)===v&&r.date===b),q=sum(P,r=>+r.qty||0);if(q)return sum(P,val)/q;let h="";D.harvest.forEach(r=>{if(vk(r.variety)===v&&r.date<=d&&+r.rate>0&&r.date>h)h=r.date});const H=D.harvest.filter(r=>vk(r.variety)===v&&r.date===h),hq=sum(H,r=>+r.qty||0);return hq?sum(H,r=>(+r.qty||0)*(+r.rate||0))/hq:0}
function prevClose(v,d){let b="";allV().forEach(r=>{if(vk(r.variety)===v&&r.date<d&&r.date>b)b=r.date});return b?srow(v,b).close:0}
function srow(v,d){
 const k=v+"|"+d;if(memo[k])return memo[k];
 const doc=D.stock.find(x=>x.date===d&&vk(x.variety)===v)||{};
 const bought=sum(D.proc.filter(r=>vk(r.variety)===v&&r.date===d),r=>+r.qty||0),harv=sum(D.harvest.filter(r=>vk(r.variety)===v&&r.date===d),r=>+r.qty||0),sold=sum(D.sales.filter(r=>vk(r.variety)===v&&r.date===d),r=>+r.qty||0);
 const auto=prevClose(v,d),opening=typeof doc.opening==="number"?doc.opening:auto,waste=+doc.wastage||0,exp=opening+bought+harv-sold-waste,has=typeof doc.physical==="number";
 return memo[k]={v,doc,auto,opening,bought,harv,sold,waste,exp,has,close:has?doc.physical:exp,diff:has?doc.physical-exp:0,rate:rateFor(v,d)};
}
function stockRows(d){
 const nm=vnames(),keys=new Set();
 allV().forEach(r=>{if(r.date===d&&vk(r.variety))keys.add(vk(r.variety))});
 Object.keys(nm).forEach(k=>{if(!keys.has(k)&&prevClose(k,d)>0.001)keys.add(k)});
 return [...keys].map(k=>({...srow(k,d),name:nm[k]})).sort((a,b)=>a.name.localeCompare(b.name));
}
const kc=(l,v,x="")=>`<div class="card"><div class="l">${l}</div><div class="v">${v}</div>${x}</div>`;
const n2=x=>Math.round((+x||0)*100)/100;
function stockTabs(){return `<div class="top" style="margin-top:-8px"><button class="btn s ${view==="stock"?"":"g"}" onclick="go('stock')">Daily stock</button><button class="btn s ${view==="harvest"?"":"g"}" onclick="go('harvest')">Own-farm additions</button></div>`}
function stockV(){
